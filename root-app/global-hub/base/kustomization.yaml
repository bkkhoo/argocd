---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # the following are for managed hub
  - ../../../apps/02-managed-hub-bootstrap/dev
  - ../../../apps/02-managed-hub-bootstrap/prod

  # other apps to deploy to global-hub
  - ../../../apps/cluster-config/base            # this app set deploys to all cluster
  - ../../../apps/rhacm-policies/base
  - ../../../apps/openshift-web-terminal/base    # this app set deploys to all cluster

patches:
  # apps/cluster-config is set to deploy to all clusters, it is meant for managed-hubs
  # patch the app so that it targets only in-cluster of global-hub
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: cluster-config
    patch: |
      - op: replace
        path: /spec/generators/0
        value:
          list:
            elements:
              - name: in-cluster
                server: https://kubernetes.default.svc
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: openshift-web-terminal
    patch: |
      - op: replace
        path: /spec/generators/0
        value:
          list:
            elements:
              - name: in-cluster
                server: https://kubernetes.default.svc
...
