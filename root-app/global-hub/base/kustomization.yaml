---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/cluster-config/base
  - ../../../apps/02-managed-hub-bootstrap/dev
  - ../../../apps/02-managed-hub-bootstrap/prod

patches:
  # apps/cluster-config is set to deploy to all clusters, it is meant for managed-hubs
  # patch the app so that it targets managedClusters attached to global-hub that are not managed-hubs
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: cluster-config
    patch: |
      - op: replace
        path: /spec/generators/0/clusters
        value:
          selector:
            matchExpressions:
              - key: managed-hub
                operator: DoesNotExist
              - key: name
                operator: DoesNotExist
...
