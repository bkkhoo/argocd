# ansible-playbook -i localhost, misc/cribl-cloud/ansible/configure-cribl.yaml
---
- name: unconfigure cribl
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - cribl-secrets-vault-encrypted.yaml                     # this file is encrypted with ansible-vault
  vars:
    cribl_cloud_base_url: "https://{{ cribl.workspace }}-{{ cribl.org_id }}.cribl.cloud"

  tasks:
    - name: get cribl api token
      vars:
        _client_id: "{{ cribl.client_id }}"
        _client_secret: "{{ cribl.client_secret }}"
      ansible.builtin.import_tasks: tasks/get-cribl-api-token.yaml

    - name: delete data routes
      ansible.builtin.uri:
        url: "{{ cribl_cloud_base_url }}/api/v1/m/{{ cribl.worker_group }}/routes/default"
        method: PATCH
        headers:
          Authorization: "Bearer {{ cribl_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          id: default
          groups: {}
          comments: []
          routes:
            - id: default
              name: default
              pipeline: passthru
              output: default
        status_code: 200

    - name: delete data sources
      loop:
        - http
        - in-raw-http
        - in-prometheus-rw
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _endpoint: "/api/v1/m/{{ cribl.worker_group }}/system/inputs"
        _api_token: "{{ cribl_api_token }}"
        _resource_name: "{{ item }}"
      ansible.builtin.include_tasks: tasks/delete-resource.yaml

    - name: delete event breaker ruleset
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _endpoint: "/lib/breakers"
        _api_token: "{{ cribl_api_token }}"
        _resource_name: break-json-array
      ansible.builtin.include_tasks: tasks/delete-resource.yaml

    - name: delete data destinations
      loop:
        - out-output-router
        - out-openshift-lokistack-application
        - out-openshift-lokistack-infrastructure
        - out-openshift-lokistack-audit
        - out-cribl-lake
        - out-openshift-s3
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _endpoint: "/api/v1/m/{{ cribl.worker_group }}/system/outputs"
        _api_token: "{{ cribl_api_token }}"
        _resource_name: "{{ item }}"
      ansible.builtin.include_tasks: tasks/delete-resource.yaml

    - name: delete pipelines
      loop:
        - application-log-transform
        - infrastructure-log-transform
        - audit-log-transform
        - raw-http-remove-fields
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _endpoint: "/api/v1/m/{{ cribl.worker_group }}/pipelines"
        _api_token: "{{ cribl_api_token }}"
        _resource_name: "{{ item }}"
      ansible.builtin.include_tasks: tasks/delete-resource.yaml

    - name: delete secrets
      loop:
        - openshift-loki-log-collector-token
        - openshift-s3-auth
        - prometheus-remote-write-token
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _endpoint: "/api/v1/m/{{ cribl.worker_group }}/system/secrets"
        _api_token: "{{ cribl_api_token }}"
        _resource_name: "{{ item }}"
      ansible.builtin.include_tasks: tasks/delete-resource.yaml

    - name: commit and deploy changes
      vars:
        _base_url: "{{ cribl_cloud_base_url }}"
        _api_token: "{{ cribl_api_token }}"
      ansible.builtin.import_tasks: tasks/commit-deploy.yaml
...
