---
apiVersion: v1
kind: Namespace
metadata:
  name: test-bad-status
spec: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: test-oom-kill
  namespace: test-bad-status
spec:
  containers:
  - name: test-oom-kill
    image: docker.io/polinux/stress:latest
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-image-pull-backoff
  namespace: test-bad-status
spec:
  containers:
  - name: test-image-pull-backoff
    image: dummy
...

