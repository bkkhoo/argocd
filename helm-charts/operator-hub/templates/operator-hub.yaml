---
apiVersion: config.openshift.io/v1
kind: OperatorHub
metadata:
  name: cluster
spec:
  sources:
    - name: redhat-operators
      disabled: {{ .Values.disableRedhatOperators }}
    - name: certified-operators
      disabled: {{ .Values.disableCertifiedOperators }}
    - name: community-operators
      disabled: {{ .Values.disableCommunityOperators }}
    - name: redhat-marketplace
      disabled: {{ .Values.disableRedhatMarketplace }}
...
