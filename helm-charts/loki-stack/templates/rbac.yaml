{{- if .Values.lokiStack.externalDataSource }}
---
# openshift logging operator creates the ClusterRole logging-collector-logs-writer with these privileges
# create the ClusterRole here to ensure privileges are granted even when openshift logging operator is not installed
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: external-logs-writer
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - verbs:
      - create
    apiGroups:
      - loki.grafana.com
    resources:
      - application
      - audit
      - infrastructure
    resourceNames:
      - logs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-logs-writer
  namespace: {{ .Values.lokistack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-logs-writer
  annotations:
    argocd.argoproj.io/sync-wave: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-logs-writer
subjects:
  - kind: ServiceAccount
    name: external-logs-writer
    namespace: {{ .Values.lokistack.namespace }}
...
{{- end }}
