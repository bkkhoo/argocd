# predefined exclusions to ensure consistency in configuration, and ease maintenance
---
openshift:
  - name: "openshift system namespaces"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: "^(kube-.*|openshift-.*|openshift)$"
        label:

rhacs:
  - name: "rhacs namespaces"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: "^(rhacs-operator|stackrox)$"
        label:

rhacm:    # including multicluster global hub
  - name: "rhacm namespaces"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: "^(open-cluster-management.*|hive|hypershift|multicluster-engine|multicluster-global-hub.*)$"
        label:

etcd-backup:
  - name: "etcd-backup"
    deployment:
      name: "etcd-backup"
      scope:
        cluster: ""
        namespace: "etcd-backup"
        label:

openshift-pipelines:
  - name: "openshift-pipeline EventListener"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: ""
        label:
          key: "app.kubernetes.io/managed-by"
          value: "EventListener"
  - name: "openshift-pipeline TaskRun pod"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: ""
        label:
          key: "app.kubernetes.io/managed-by"
          value: "tekton-pipelines"

openshift-serverless:
  - name: "openshift-serverless namespaces"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: "^knative-(eventing|serving|serving-ingress)$"
        label:

metallb:
  - name: "metal lb namespaces"
    deployment:
      name: ""
      scope:
        cluster: ""
        namespace: "metallb-system"
        label:
...

