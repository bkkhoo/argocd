{{- $values := .Values }}
{{- range $index := list 1 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-bgp-peer-{{ $index }}
  namespace: {{ $values.namespace }}
  labels:
    app: dummy-bgp-peer
    component: peer-{{ $index }}
spec:
  type: ClusterIP
  clusterIP: {{ $values.clusterIpPrefix }}.{{ $index }}
  selector:
    app: dummy-bgp-peer
    component: peer-{{ $index }}
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: bgp
      port: 1790
      protocol: TCP
      targetPort: 1790
  sessionAffinity: None
{{- end }}
...
