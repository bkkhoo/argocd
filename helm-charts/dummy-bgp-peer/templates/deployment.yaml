---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-bgp-peer
  namespace: {{ .Values.namespace }}
  labels:
    app: dummy-bgp-peer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-bgp-peer
  strategy:
    type: Recreate
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  template:
    metadata:
      name: log-receiver
      labels:
        app: dummy-bgp-peer
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: name
                operator: In
                values:
                - dummy-bgp-peer
            topologyKey: "kubernetes.io/hostname"
      containers:
        - name: dummy-bgp-peer
          image: {{ .Values.bgpPeerImage }}
          volumeMounts:
            - mountPath: /config
              name: bgp-config
              readOnly: true
      hostNetwork: true
      serviceAccountName: {{ .Values.serviceAccount }}
      automountServiceAccountToken: false
      volumes:
        - name: bgp-config
          configMap:
            name: bgp-config
...
