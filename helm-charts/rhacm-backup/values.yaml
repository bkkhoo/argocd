rhacmBackup:
  namespace: open-cluster-management-backup
  hourInterval: 2
  ttl: 72h
  s3:
    url: https://s3.example.com
    region: us-east-1
    bucket: rhacm-backup-bucket
    bucketPrefix: hub01
    forcePathStyle: true
    insecureSkipTLSVerify: false
  resources:
    # limits:
    #   cpu: "2"
    #   memory: 1Gi
    requests:
      cpu: 500m
      memory: 128Mi
syncHookImage:
  name: registry.redhat.io/openshift4/ose-tools-rhel9
  tag: v4.20
...
