---
deploymentType: all              # operator, mch, all
rhacmNamespace: open-cluster-management
operatorChannel: release-2.17
availabilityConfig: High         # Basic or High
disableHubSelfManagement: false
observability:
  namespace: open-cluster-management-observability
  instanceSize: default
  namespaceRightSizingRecommendation: true
  virtualizationRightSizingRecommendation: true
  objectStorage:
    name: observability-rhacm-s3
    storageClassName: openshift-storage.noobaa.io
    insecureSkipVerify: false
    caSecret: object-storage-ca
resourceRequirements:
  configPolicyController:
    limits:
      memory: 1Gi
clusterBackup:
  enabled: "no"
  namespace: open-cluster-management-backup
  hourInterval: 2
  ttl: 72h
  s3:
    url: https://s3.example.com
    region: us-east-1
    bucket: rhacm-backup-bucket
    bucketPrefix: hub01
    forcePathStyle: true
    insecureSkipTLSVerify: false
  oadpSubscription:
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    channel: stable
    installPlanApproval: Automatic
  resources:
    # limits:
    #   cpu: "2"
    #   memory: 1Gi
    requests:
      cpu: 500m
      memory: 128Mi
syncHookImage:
  name: registry.redhat.io/openshift4/ose-tools-rhel9
  tag: v4.20
...
