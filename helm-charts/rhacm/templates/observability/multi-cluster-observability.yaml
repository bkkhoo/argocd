{{- if has .Values.deploymentType (list "mco" "operator+mco" "all") }}
---
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "210"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    observability.open-cluster-management.io/right-sizing-capable: v1
spec:
  capabilities:
    platform:
      analytics:
        namespaceRightSizingRecommendation:
          enabled: {{ .Values.observability.namespaceRightSizingRecommendation }}
        virtualizationRightSizingRecommendation:
          enabled: {{ .Values.observability.virtualizationRightSizingRecommendation }}
      metrics:
        default:
          enabled: true
    userWorkloads:
      metrics:
        default:
          enabled: true
  instanceSize: {{ .Values.observability.instanceSize }}
  observabilityAddonSpec: {}
  storageConfig:
    metricObjectStorage:
      name: {{ .Values.observability.objectStorage.name }}
      key: thanos.yaml
      tlsSecretName: {{ .Values.observability.objectStorage.caSecret }}
      tlsSecretMountPath: /etc/s3-buckets/certs
...
{{- end }}
