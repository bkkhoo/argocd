{{- if eq .Values.clusterBackup.enabled "yes" }}
  {{- $randomMinute := mod (randNumeric 2 | atoi) 59 -}}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: BackupSchedule
metadata:
  name: rhacm-backup-schedule
  namespace: {{ .Values.clusterBackup.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "305"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  veleroSchedule: "{{ $randomMinute }} */{{ .Values.clusterBackup.hourInterval }} * * *"
  veleroTtl: {{ .Values.clusterBackup.ttl }}
  useManagedServiceAccount: true
  paused: false
...
{{- end }}
