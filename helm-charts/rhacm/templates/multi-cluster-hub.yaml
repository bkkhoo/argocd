{{- if has .Values.deploymentType (list "mch" "all") }}
---
apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: {{ .Values.rhacmNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "100"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if .Values.clusterBackup.enabled }}
    installer.open-cluster-management.io/oadp-subscription-spec: '{"source": "{{ .Values.clusterBackup.oadpSubscription.source }}","sourceNamespace": "{{ .Values.clusterBackup.oadpSubscription.sourceNamespace }}","channel": "{{ .Values.clusterBackup.oadpSubscription.channel }}","installPlanApproval": "{{ .Values.clusterBackup.oadpSubscription.installPlanApproval }}"}'
    {{- end }}
spec:
  localClusterName: local-cluster
  availabilityConfig: {{ .Values.availabilityConfig }}
  {{- if .Values.disableHubSelfManagement }}
  disableHubSelfManagement: {{ .Values.disableHubSelfManagement }}
  {{- end }}
  overrides:
    components:
      - name: cluster-lifecycle
        enabled: true
        configOverrides: {}
      - name: app-lifecycle
        enabled: true
        configOverrides: {}
      - name: multicluster-engine
        enabled: true
        configOverrides: {}
      - name: grc                    # governance and risk
        enabled: true
        configOverrides: {}
      - name: console
        enabled: true
        configOverrides: {}
      - name: insights
        enabled: true
        configOverrides: {}
      - name: search
        enabled: true
        configOverrides: {}
      - name: cluster-backup
        enabled: {{ .Values.clusterBackup.enabled }}
        configOverrides: {}
...
{{- end }}
