{{- if eq .Values.deploymentType "all" }}
---
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnDeploymentConfig
metadata:
  name: config-policy-controller
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "300"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  resourceRequirements:
    - containerID: "deployments:config-policy-controller:config-policy-controller"
      resources:
        limits:
          memory: {{ .Values.resourceRequirements.configPolicyController.limits.memory }}
        requests:
          memory: 128Mi     # this is default; setting limits without requests will result in requests == limits
...
{{- end }}
