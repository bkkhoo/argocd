---
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-backup-now
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  activeDeadlineSeconds: 600      # max duration the job is allowed to run
  template:
    spec:
      containers:
        - name: etcd-backup
          image: {{ .Values.cronjobContainerImage }}
          command:
            - /bin/sh
            - -c
            - oc -n {{ .Values.namespace }} delete job etcd-backup-now && oc -n {{ .Values.namespace }} create job etcd-backup-now --from=cronjob/etcd-backup
          volumeMounts:
            - name: snapshot-db-backup
              mountPath: /snapshot-db-backup
            - name: static-resources-backup
              mountPath: /static-resources-backup
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      serviceAccountName: etcd-backup-sync-hook
      terminationGracePeriodSeconds: 30
      volumes:
        - name: snapshot-db-backup
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.snapshot.name }}
        - name: static-resources-backup
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.staticResources.name }}
...
