---
deploymentType: all         # operator, argocd, all
namespace:
  operator: openshift-gitops-operator
  argocd: openshift-gitops
server:
  autoscale:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
rbac:
  defaultPolicy: ""        # example: role:admin, role:readonly
  policy: |
    g, system:cluster-admins, role:admin
    g, cluster-admins, role:admin
repo:
  replicas: 3
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  rhacmPolicyGeneratorImage: registry.redhat.io/rhacm2/multicluster-operators-subscription-rhel9:v2.16
tls:
  customCA: "custom-ca.crt"
redis:
  ha:
    enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
controller:
  sharding:
    enabled: true
    replicas: 3
    # legacy: default method, which uses a simple modulo operation based on the cluster's index in a sorted list; this approach can cause significant cluster reassignment when clusters are added or removed.
    # round-robin: distributes clusters sequentially across shards in order; this provides a more even distribution by count but remains sensitive to changes in the cluster list order.
    # consistent-hashing: uses a consistent hashing algorithm with bounded loads to equalize distribution while minimizing the reshuffling of clusters when shards or clusters are added or removed, recommended for dynamic environments.
    algorithm: consistent-hashing
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi
disableAdmin: false
appProjects: []
localUsers:
  - username: api-admin
    apiKey: true
    login: true
    role: "role:admin"
postSyncHookImage: registry.redhat.io/openshift4/ose-tools-rhel9:v4.20
...
