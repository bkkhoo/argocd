---
resources:
  limits:
    cpu: "6"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 64Mi
serviceAccount: log-collector
outputs:
  httpTimeout: 10
  application:
    url: "https://application.log-receiver.svc:8443/log"
    secret:
      name: application-log-token
      key: token
  infrastructure:
    url: "https://infrastructure.log-receiver.svc:8443/log"
    secret:
      name: infrastructure-log-token
      key: token
  audit:
    url: "https://audit.log-receiver.svc:8443/log"
    secret:
      name: audit-log-token
      key: token
...
