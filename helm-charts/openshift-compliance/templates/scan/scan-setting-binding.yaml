---
apiVersion: compliance.openshift.io/v1alpha1
kind: ScanSettingBinding
metadata:
  name: oc4-cis
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "105"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
profiles:
  - name: ocp4-cis                         # check cluster profile
    apiGroup: compliance.openshift.io/v1alpha1
    kind: Profile
  - name: ocp4-cis-node                    # check nodes profile
    apiGroup: compliance.openshift.io/v1alpha1
    kind: Profile
settingsRef:
  apiGroup: compliance.openshift.io/v1alpha1
  kind: ScanSetting
  name: raw-result-on-worker               # this store raw result on worker instead of master
...
