---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: pg-configure
policyDefaults:
  namespace: rhacm-policies
  policyAnnotations:
    generated-by: policy-generator
    # argocd.argoproj.io/sync-wave: "3"
    # argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-02 Baseline Configuration
  remediationAction: enforce
  policySets:
    - config-all-clusters
  severity: medium
  # placement:
  #   name: placement-config    # consolidate multiple policies under a single Placement
  #   labelSelector:
  #     matchExpressions:
  #       - key: vendor
  #         operator: In
  #         values:
  #           - OpenShift
policySets:
  - name: config-all-clusters
    placement:
      labelSelector:
        matchExpressions:
          - key: vendor
            operator: In
            values:
              - OpenShift
placementBindingDefaults:
  name: binding-config

policies:
  - name: config-remove-kubeadmin
    complianceType: mustnothave
    manifests:
      - path: config/kubeadmin-secret.yaml

  - name: config-rhacs-secured-cluster
    complianceType: musthave
    policySets: []
    placement:         # override policyDefaults.placement
      labelSelector:
        matchExpressions:
          - key: vendor
            operator: In
            values: ["OpenShift"]
          - key: name
            operator: NotIn
            values: ["local-cluster"]
    manifests:
      - path: config/rhacs/secured-cluster.yaml
      - path: config/rhacs/secret.yaml
...
