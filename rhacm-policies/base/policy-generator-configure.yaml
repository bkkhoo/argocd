---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: pg-configure
policyDefaults:
  namespace: rhacm-policies
  # policyAnnotations:
  #   argocd.argoproj.io/sync-wave: "3"
  #   argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  placement:
    name: placement-configure    # consolidate multiple policies under a single Placement
    labelSelector:
      vendor: OpenShift
placementBindingDefaults:
  name: binding-configure        # consolidates multiple policies into a single PlacementBinding

policies:
  # this policy target all clusters with vendor=OpenShift label
  - name: config-remove-kubeadmin
    standards:
      - NIST SP 800-53
    categories:
      - SC System and Communications Protection
    controls:
      - SC-1 SYSTEM AND COMMUNICATIONS PROTECTION POLICY AND PROCEDURES
    complianceType: mustnothave
    remediationAction: enforce
    severity: medium
    manifests:
      - path: config/kubeadmin-secret.yaml

  # this policy target all clusters with vendor=OpenShift label, except the local-cluster
  - name: config-rhacs-secured-cluster
    standards:
      - NIST SP 800-53
    categories:
      - CM Configuration Management
    controls:
      - CM-2 Baseline Configuration
    complianceType: musthave
    remediationAction: enforce
    severity: medium
    placement:         # override policyDefaults.placement
      name: placement-rhacs-secured-cluster
      labelSelector:
        matchExpressions:
          - key: vendor
            operator: In
            values: ["OpenShift"]
          - key: name
            operator: NotIn
            values: ["local-cluster"]
    manifests:
      - path: config/rhacs/secured-cluster.yaml
      - path: config/rhacs/secret.yaml
...
