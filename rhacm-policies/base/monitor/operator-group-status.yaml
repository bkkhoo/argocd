# check namespaces with more than 1 operatorGroups
# note: nindent template functions only available with rhacm v2.16
---
object-templates-raw: |
  {{- $ogs := lookup "operators.coreos.com/v1" "OperatorGroup" "" "" }}
  {{- $namespaced_og_count := dict }}
  {{- range $ogs.items }}
    {{- if not (hasKey $namespaced_og_count .metadata.namespace) }}
      {{ $namespaced_og_count := set $namespaced_og_count .metadata.namespace 1 }}
    {{- else }}
      {{- $old_count := get $namespaced_og_count .metadata.namespace -}}
      {{- $count := add $old_count 1 }}
      {{- $_ := set $namespaced_og_count .metadata.namespace $count -}}
    {{- end }}
  {{- end }}
  {{- range $k, $v := $namespaced_og_count }}
    {{- if gt $v 1 }}
    {{- $namespaced_ogs := lookup "operators.coreos.com/v1" "OperatorGroup" $k "" }}
      {{- range $namespaced_ogs.items }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: {{ .metadata.name }}
        namespace: {{ .metadata.namespace }}
      spec:
        {{ toYaml .spec | indent 6 }}
      status:
        {{ toYaml .status | indent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
...
