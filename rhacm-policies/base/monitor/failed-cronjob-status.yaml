# flag if the last scheduled run of the cronjob failed
---
object-templates-raw: |
  {{- $cronjobs := dict }}
  {{- range (lookup "batch/v1" "CronJob" "" "").items }}
    {{- $namespace := .metadata.namespace }}
    {{- $name := .metadata.name }}
    {{ $fqdn := printf "%s/%s" .metadata.namespace .metadata.name }}
    {{- $dict := dict "cronjobName" .metadata.name
                      "cronjobNamespace" .metadata.namespace
                      "schedule" .spec.schedule
                      "status" .status }}
    {{- $cronjobs = merge $cronjobs (dict $fqdn $dict) }}
  {{- end }}
  {{- range $cronjobs }}
    {{ $fqdn := printf "%s/%s" .cronjobNamespace .cronjobName }}
    {{- $cronjob_name := .cronjobName }}
    {{- $jobs := list }}
    {{- range (lookup "batch/v1" "Job" .cronjobNamespace "").items }}
      {{- if hasKey .metadata "ownerReferences" }}
        {{- $owner := index .metadata.ownerReferences 0 }}
        {{- if and (eq $owner.kind "CronJob") (eq $owner.name $cronjob_name) }}
          {{- $jobs = append $jobs (printf "%s active=%s succeeded=%s failed=%s"
                                           .metadata.creationTimestamp
                                           (hasKey .status "active" | toString)
                                           (hasKey .status "succeeded" | toString)
                                           (hasKey .status "failed" | toString)) }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $dict := dict $fqdn (dict "jobs" ($jobs | sortAlpha)) }}
    {{- $cronjobs = merge $cronjobs $dict }}
  {{- end }}
  {{- range $cronjobs }}
    {{- $status := split " " (last .jobs | toString) }}
    {{- if eq $status._1 "active=false" }}
      {{- if eq $status._2 "succeeded=false" }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: {{ .cronjobName }}
        namespace: {{ .cronjobNamespace }}
      spec:
        schedule: "{{ .schedule }}"
      status:
        {{ .status | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
...
