# check for default storageClass
# if more than 1, list all as violations
object-templates-raw: |
  {{- $storage_classes := (lookup "storage.k8s.io/v1" "StorageClass" "" "") }}
  {{- $default_sc := 0 }}
  {{- if gt (len $storage_classes.items) 1 }}
    {{ range $storage_classes.items }}
      {{- $annotations := .metadata.annotations }}
      {{- if and $$annotations (eq (index $annotations "storageclass.kubernetes.io/is-default-class") "true") }}
        {{- $default_sc = add $default_sc 1 }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if gt $default_sc 1 }}
    {{ range $storage_classes.items }}
  - complianceType: mustnothave
    objectDefinition:
      kind: StorageClass
      apiVersion: storage.k8s.io/v1
      metadata:
        name: {{ .metadata.name }}
    {{- end }}
  {{- end }}
