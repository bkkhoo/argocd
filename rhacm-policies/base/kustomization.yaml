---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - managed-cluster-set-binding.yaml
generators:
  - policy-generator-monitor.yaml
  - policy-generator-configure.yaml

patches:
  - target:
      kind: Placement
    patch: |
      - op: add
        path: "/spec/clusterSets"
        value:
          - gitops-clusters
          - default
...
