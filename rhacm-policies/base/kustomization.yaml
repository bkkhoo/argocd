---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# not specifying namespace property, since resources are deployed to more than one namespaces
# each resource should set the metadata.namespace property

resources:
  - namespace.yaml
  - managed-cluster-set-binding.yaml

generators:
  - policy-generator-monitor.yaml
  - policy-generator-configure.yaml

