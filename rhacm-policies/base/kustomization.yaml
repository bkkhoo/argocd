---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - managed-cluster-set-binding.yaml
generators:
  - policy-generator-monitor.yaml
  - policy-generator-certificate.yaml
  - policy-generator-configure.yaml

patches:
  - target:         # placements generated by policyGenerator does not include clusterSets and annotations
      kind: Placement
    patch: |
      - op: add
        path: "/spec/clusterSets"
        value:
          - gitops-clusters
          - default
      - op: add
        path: "/metadata/annotations"
        value:
          generated-by: policy-generator
          argocd.argoproj.io/sync-wave: "5"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:         # placementBindings does not include annotations
      kind: PlacementBinding
    patch: |
      - op: add
        path: "/metadata/annotations"
        value:
          generated-by: policy-generator
          argocd.argoproj.io/sync-wave: "5"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:         # PolicySets does not include annotations
      kind: PolicySet
    patch: |
      - op: add
        path: "/metadata/annotations"
        value:
          generated-by: policy-generator
          argocd.argoproj.io/sync-wave: "5"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
...
