---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # no need to create rhacm-policies namespace, since it has been created as part of 01-managed-hub-app-of-apps
  # creating the namespace here will cause 01-managed-hub-app-of-apps and 00-rhacm-policies apps to oscillate between Synced/OutOfSync:
  #   'Namespace/rhacm-policies is part of applications openshift-gitops/00-rhacm-policies and dev-dev-hub01-managed-hub-bootstrap'
  # - namespace.yaml
  - managed-cluster-set-binding.yaml
generators:
  - policy-generator-monitor.yaml
  - policy-generator-configure.yaml

patches:
  - target:         # placement generated by policyGenerator does not include clusterSets
      kind: Placement
    patch: |
      - op: add
        path: "/spec/clusterSets"
        value:
          - gitops-clusters
          - default
...
