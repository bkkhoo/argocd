# distribute secrets from global-hub to managed-hubs
# using lookup instead of fromClusterClaim as fromClusterClaim error when claim odes not exist, rhacm v2.16 might fix
---
object-templates-raw: |
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: openshift-logging-token
        namespace: rhacm-policies
      data:
        {{- $env := (lookup "cluster.open-cluster-management.io/v1alpha1" "ClusterClaim" "" "env").spec.value | default "prod" }}
        {{- if eq $env "dev" }}
        {{hub copySecretData "rhacm-policies" "openshift-logging-token-dev" hub}}
        {{- end }}
        {{- if eq $env "uat" }}
        {{hub copySecretData "rhacm-policies" "openshift-logging-token-uat" hub}}
        {{- end }}
        {{- if eq $env "prod" }}
        {{hub copySecretData "rhacm-policies" "openshift-logging-token-prod" hub}}
        {{- end }}
...
