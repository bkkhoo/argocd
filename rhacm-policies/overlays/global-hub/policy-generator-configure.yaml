---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gh-config-policy
policyDefaults:
  namespace: rhacm-policies
  policyAnnotations:
    generated-by: policy-generator
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-02 Baseline Configuration
  remediationAction: enforce
  policySets: []
  severity: medium
policySets:
  - name: gh-config-local-cluster
    description: global hub config policies for local-cluster
    placement:
      labelSelector:
        matchExpressions:
          - key: name
            operator: In
            values:
              - local-cluster
  - name: gh-config-dev-hubs
    description: global hub config policies for all dev hubs
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - dev
  - name: gh-config-uat-hubs
    description: global hub config policies for all uat hubs
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - uat
  - name: gh-config-prod-hubs
    description: global hub config policies for all prod hubs
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - prod
  - name: gh-config-dev-rhacm-backup-secret
    description: global hub config policies for all dev hubs with rhacm-backup label
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - dev
          - key: rhacm-backup
            operator: Exists
  - name: gh-config-uat-rhacm-backup-secret
    description: global hub config policies for all uat hubs with rhacm-backup label
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - uat
          - key: rhacm-backup
            operator: Exists
  - name: gh-config-prod-rhacm-backup-secret
    description: global hub config policies for all prod hubs with rhacm-backup label
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
          - key: env
            operator: In
            values:
              - prod
          - key: rhacm-backup
            operator: Exists
placementBindingDefaults:
  name: gh-config-binding

policies:
  - name: config-sync-secrets-dev-hub
    description: Sync global hub secrets to dev managed hubs
    policySets:         # override policyDefaults.policySets
      - gh-config-dev-hubs
    manifests:
      - path: config/sync-secret/dev-hub-sync-secret.yaml

  - name: config-sync-secrets-uat-hub
    description: Sync global hub secrets to uat managed hubs
    policySets:         # override policyDefaults.policySets
      - gh-config-uat-hubs
    manifests:
      - path: config/sync-secret/uat-hub-sync-secret.yaml

  - name: config-sync-secrets-prod-hub
    description: Sync global hub secrets to prod managed hubs
    policySets:         # override policyDefaults.policySets
      - gh-config-prod-hubs
      # the entire multi cluster setup should only have one local-cluster (which is the global-hub), which is a prod hub cluster
      - gh-config-local-cluster
    manifests:
      - path: config/sync-secret/prod-hub-sync-secret.yaml

  - name: config-rhacm-backup-secret-dev-hub
    description: Sync global hub rhacm backup secret to dev managed hubs with rhacm-backup label
    policySets:         # override policyDefaults.policySets
      - gh-config-dev-rhacm-backup-secret
    manifests:
      - path: config/rhacm-backup/dev-env.yaml

  - name: config-rhacm-backup-secret-uat-hub
    description: Sync global hub rhacm backup secret to uat managed hubs with rhacm-backup label
    policySets:         # override policyDefaults.policySets
      - gh-config-uat-rhacm-backup-secret
    manifests:
      - path: config/rhacm-backup/uat-env.yaml

  - name: config-rhacm-backup-secret-prod-hub
    description: Sync global hub rhacm backup secret to prod managed hubs with rhacm-backup label
    policySets:         # override policyDefaults.policySets
      - gh-config-prod-rhacm-backup-secret
    manifests:
      - path: config/rhacm-backup/prod-env.yaml
...
