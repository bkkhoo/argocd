---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gh-config-policy
policyDefaults:
  namespace: rhacm-policies
  policyAnnotations:
    generated-by: policy-generator
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-02 Baseline Configuration
  remediationAction: enforce
  policySets:
    - gh-config-all-clusters
  severity: medium
policySets:
  - name: gh-config-all-clusters
    placement:
      labelSelector:
        matchExpressions:
          - key: vendor
            operator: In
            values:
              - OpenShift
  - name: gh-config-managed-hubs
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists

placementBindingDefaults:
  name: gh-config-binding

policies:
  - name: config-argocd-repo-secrets
    policySets:         # override policyDefaults.policySets
      - gh-config-managed-hubs
    manifests:
      - path: config/openshift-gitops/repo-secret.yaml
...
