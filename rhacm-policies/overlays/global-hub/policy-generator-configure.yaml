---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gh-config-policy
policyDefaults:
  namespace: rhacm-policies
  policyAnnotations:
    generated-by: policy-generator
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-02 Baseline Configuration
  remediationAction: enforce
  policySets:
    - gh-config-all-clusters
  severity: medium
policySets:
  - name: gh-config-local-cluster
    description: global hub config policies for local-cluster
    placement:
      labelSelector:
        matchExpressions:
          - key: name
            operator: In
            values:
              - local-cluster
  - name: gh-config-managed-hubs
    description: global hub config policies for all managed hubs
    placement:
      labelSelector:
        matchExpressions:
          - key: managed-hub
            operator: Exists
placementBindingDefaults:
  name: gh-config-binding

policies:
  - name: config-argocd-repo-secrets
    description: copy argocd repo secrets from global hub to managed hubs
    policySets:         # override policyDefaults.policySets
      - gh-config-managed-hubs
    manifests:
      - path: config/openshift-gitops/repo-secret.yaml

  - name: config-openshift-logging-http-secret-hub
    description: copy openshift logging http endpoint authentication secrets to global hub and managed hubs
    policySets:         # override policyDefaults.policySets
      # - gh-config-local-cluster
      - gh-config-managed-hubs
    manifests:
      # - path: config/openshift-logging/secret.yaml
      - path: config/openshift-logging/template-raw-secret.yaml

  - name: config-metallb-bgp-password-secret-hub
    description: copy metallb bgp password secret from global hub to managed hubs
    policySets:         # override policyDefaults.policySets
      - gh-config-managed-hubs
    manifests:
      - path: config/metallb-bgp-password-secret.yaml
...
