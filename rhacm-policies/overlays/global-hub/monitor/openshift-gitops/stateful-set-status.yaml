# check openshift-gitops-application-controller statefulSet
# violation if status.availableReplicas != status.replicas
---
object-templates-raw: |
  {{- $ss := lookup "apps/v1" "StatefulSet" "openshift-gitops" "openshift-gitops-application-controller" }}
  {{- $replicas := $ss.status.replicas }}
  {{- $available_replicas := $ss.status.availableReplicas }}
  {{- if ne $replicas $available_replicas }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: openshift-gitops-application-controller
        namespace: openshift-gitops
      status:
        availableReplicas: {{ $available_replicas }}
        replicas: {{ $replicas }}
  {{- end }}
...
