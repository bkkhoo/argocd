---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dummy-log-receiver
  namespace: openshift-gitops
  labels:
    applications: log-receiver
spec:
  goTemplate: true                     # enable go templating for spec.template field
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: managed-hub
              operator: DoesNotExist
            - key: dummy-log-receiver
              operator: Exists
  template:
    metadata:
      name: "{{ .name }}-dummy-log-receiver"
      labels:
        applications: log-receiver
    spec:
      project: gitops
      source:
        repoURL: https://github.com/bkkhoo/argocd.git
        targetRevision: main
        path: helm-charts/dummy-log-receiver
        helm:
          valuesObject:
            labels:
              env: '{{ .metadata.labels.env }}'
      destination:
        server: "{{ .server }}"
        namespace: log-receiver
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      info:
        - name: env
          value: any
        - name: type
          value: applicationSet
        - name: target
          value: clusters with dummy-log-receiver but without managed-hub labels
...
