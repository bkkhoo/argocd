---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: uat-managed-hub-bootstrap
  namespace: openshift-gitops
  labels:
    applications: managed-hub-bootstrap
spec:
  goTemplate: true                     # enable go templating for spec.template field
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: managed-hub
              operator: Exists
            - key: env
              operator: In
              values:
                - uat
  template:
    metadata:
      name: "uat-{{ .name }}-managed-hub-bootstrap"
      labels:
        applications: managed-hub-bootstrap
    spec:
      project: gitops
      sources:
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm
          helm:
            valuesObject:
              deploymentType: all    # deploy rhacm with observability
              availabilityConfig: High
              disableHubSelfManagement: true
              clusterBackup:
                enabled: false       # templatePatch will change to true if cluster has rhacm-backup label
                s3:
                  bucketPrefix: "{{ .name }}"
        - repoURL: https://github.com/bkkhoo/helm-values.git
          targetRevision: main
          path: openshift-gitops/uat
          ref: helmValues       # for referencing value files from git source
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/openshift-gitops
          helm:
            valuesObject:
              deploymentType: all
              postSyncHookImage:
                tag: 'v{{ or (index .metadata.labels "openshiftVersion-major-minor") "4.20" }}'
            valueFiles:
              # referencing values from git repo sources[1].ref
              # even though source[1].ref.path is specified, the $helmValues still represents the root of the source with ref field
              - $helmValues/openshift-gitops/uat/values.yaml
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm-openshift-gitops-integration
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: apps/00-managed-hub-app-of-apps/overlays/uat
      destination:
        server: "{{ .server }}"
      ignoreDifferences:
        - group: oadp.openshift.io
          kind: DataProtectionApplication
          name: rhacm-backup
          namespace: open-cluster-management-backup
          jsonPointers:       # these values will be set by RHACM policy
            - /spec/backupLocations/0/velero/config/s3Url
            - /spec/backupLocations/0/velero/config/region
            - /spec/backupLocations/0/velero/objectStorage/bucket
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      info:
        - name: env
          value: uat
        - name: type
          value: applicationSet
        - name: target
          value: clusters with managed-hub and env=uat labels
  templatePatch: |
    {{- if index .metadata.labels "rhacm-backup" }}
    [
      {
        "op": "replace",
        "path": "/spec/sources/0/helm/valuesObject/clusterBackup/enabled",
        "value": true
      }
    ]
    {{- end }}
...
