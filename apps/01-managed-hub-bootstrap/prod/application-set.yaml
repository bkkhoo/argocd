---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-managed-hub-bootstrap
  namespace: openshift-gitops
  labels:
    applications: managed-hub-bootstrap
spec:
  goTemplate: true                     # enable go templating for spec.template field
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: managed-hub
              operator: Exists
            - key: env
              operator: In
              values:
                - prod
  template:
    metadata:
      name: "prod-{{ .name }}-managed-hub-bootstrap"
      labels:
        applications: managed-hub-bootstrap
    spec:
      project: gitops
      sources:
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm
          helm:
            valuesObject:
              deploymentType: all    # deploy rhacm with observability
              availabilityConfig: High
              disableHubSelfManagement: true
              clusterBackup:
                enabled: false       # templatePatch will change to true if cluster has rhacm-backup label
                s3:
                  bucketPrefix: "{{ .name }}"
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/openshift-gitops
          helm:
            valuesObject:
              deploymentType: all
              postSyncHookImage:
                tag: 'v{{ or (index .metadata.labels "openshiftVersion-major-minor") "4.20" }}'
            valueFiles:    # values files are located relative to the chart path specified in the sources.path
              - ../../apps/01-managed-hub-bootstrap/prod/values.yaml
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm-openshift-gitops-integration
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: apps/00-managed-hub-app-of-apps/overlays/prod
      destination:
        server: "{{ .server }}"
      ignoreDifferences:
        - group: oadp.openshift.io
          kind: DataProtectionApplication
          name: rhacm-backup
          namespace: open-cluster-management-backup
          jsonPointers:       # these values will be set by RHACM policy
            - /spec/backupLocations/0/velero/config/s3Url
            - /spec/backupLocations/0/velero/config/region
            - /spec/backupLocations/0/velero/objectStorage/bucket
        - group: operator.open-cluster-management.io
          kind: MultiClusterHub
          name: multiclusterhub
          namespace: open-cluster-management
          jqPathExpressions:     # ignore sync status of all components except the following
            - '.spec.overrides.components[] | select(.name != "cluster-lifecycle")'
            - '.spec.overrides.components[] | select(.name != "app-lifecycle")'
            - '.spec.overrides.components[] | select(.name != "multicluster-engine")'
            - '.spec.overrides.components[] | select(.name != "grc")'
            - '.spec.overrides.components[] | select(.name != "console")'
            - '.spec.overrides.components[] | select(.name != "insights")'
            - '.spec.overrides.components[] | select(.name != "search")'
            - '.spec.overrides.components[] | select(.name != "cluster-backup")'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      info:
        - name: env
          value: prod
        - name: type
          value: applicationSet
        - name: target
          value: clusters with managed-hub and env=prod labels
  templatePatch: |
    {{- if index .metadata.labels "rhacm-backup" }}
    [
      {
        "op": "replace",
        "path": "/spec/sources/0/helm/valuesObject/clusterBackup/enabled",
        "value": true
      }
    ]
    {{- end }}
...
