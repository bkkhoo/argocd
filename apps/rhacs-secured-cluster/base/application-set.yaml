---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rhacs-secured-cluster
  namespace: openshift-gitops
  labels:
    applications: rhacs-secured-cluster
spec:
  goTemplate: true                     # enable go templating for spec.template field
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: name
              operator: NotIn
              values:
                - local-cluster
            - key: managed-hub
              operator: DoesNotExist
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            clusterLabels:
              {{- range $key, $value := .metadata.labels }}
              {{ $key }}: {{ $value }}
              {{- end }}
  template:
    metadata:
      name: "{{ .name }}-rhacs-secured-cluster"
      labels:
        applications: rhacs-secured-cluster
    spec:
      project: gitops
      source:
        repoURL: https://github.com/bkkhoo/argocd.git
        targetRevision: main
        path: helm-charts/rhacs
        helm:
          parameters:
            - name: deploymentType
              value: secured-cluster
            - name: clusterName
              value: "{{ .name }}"
      destination:
        server: "{{ .server }}"
        namespace: stackrox
      ignoreDifferences:
        - group: platform.stackrox.io        # rhacm governance policy will set the centralEndpoint
          kind: SecuredCluster
          name: stackrox-secured-cluster-services
          namespace: stackrox
          jsonPointers:
            - /spec/centralEndpoint
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      info:
        - name: env
          value: prod
        - name: type
          value: applicationSet
        - name: target
          value: not local-cluster and clusters without managed-hub label
...
