---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: rhacs-secured-cluster
    patch: |
      - op: replace
        path: /spec/template/spec/info/0/value
        value: uat
...
