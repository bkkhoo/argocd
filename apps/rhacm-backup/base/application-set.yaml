---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rhacm-backup
  namespace: openshift-gitops
  labels:
    applications: rhacm-backup
spec:
  goTemplate: true                     # enable go templating for spec.template field
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
  generators:
    - clusters:                        # on global-hub, deploy to all clusters except those with managed-hub label
        selector:                      # on managed-hubs, no cluster should have the managed-hub label
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: managed-hub
              operator: Exists
            - key: rhacm-backup
              operator: Exists
  template:
    metadata:
      name: "{{ .name }}-rhacm-backup"
      labels:
        applications: rhacm-backup
    spec:
      project: gitops
      source:
        repoURL: https://github.com/bkkhoo/argocd.git
        targetRevision: main
        path: helm-charts/rhacm-backup
        helm:
          valuesObject:
            rhacmBackup:
              s3:
                bucketPrefix: "{{ .name }}"
            postSyncHookImage:
              tag: 'v{{ or (index .metadata.labels "openshiftVersion-major-minor") "4.20" }}'
      destination:
        server: "{{ .server }}"
      ignoreDifferences:
        - group: cluster.open-cluster-management.io
          kind: BackupSchedule
          name: rhacm-backup-schedule
          namespace: open-cluster-management-backup
          jsonPointers:
            - /spec/paused
      syncPolicy:
        automated:
          prune: true
          selfHeal: true          # do not delete the resources when they are no longer defined in git
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true        # allow admin to pause backup manually
      info:
        - name: env
          value: any
        - name: type
          value: applicationSet
        - name: target
          value: rhacm hub clusters with rhacm-backup label
...
