---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: managed-hub-rhacm-argocd
    # source index 0 is rhacm, source index 1 is openshift-gitops
    patch: |
      - op: add
        path: /spec/template/spec/sources/0/helm
        value:
          valuesObject:
            deploymentType: all
            availabilityConfig: High
            disableHubSelfManagement: true
    patch: |
      - op: add
        path: /spec/template/spec/sources/1/helm
        value:
          valuesObject:
            deploymentType: all
...
