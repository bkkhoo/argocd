---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: managed-hub-rhacm-argocd
    # /spec/template/spec/sources:
    #   index 0 - rhacm
    #   index 1 - openshift-gitops
    #   index 2 - rhacm
    #   index 3 - managed-hub-app-of-apps
    patch: |
      - op: replace
        path: /spec/generators/0/clusters/selector/matchExpressions/1/value
        value: prod
      - op: add
        path: /spec/template/spec/sources/0/helm
        value:
          valuesObject:
            deploymentType: all
            availabilityConfig: High
            disableHubSelfManagement: true
      - op: add
        path: /spec/template/spec/sources/1/helm
        value:
          valuesObject:
            deploymentType: all
      - op: replace
        path: /spec/template/spec/sources/3/path
        value: app-of-apps/managed-hub/prod
...
