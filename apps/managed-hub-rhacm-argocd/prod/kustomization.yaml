---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: managed-hub-rhacm-argocd
    patch: |
      - op: add
        path: /spec/template/spec/sources/1/helm
        value:
          valuesObject:
            availabilityConfig: High
            disableHubSelfManagement: true
...
