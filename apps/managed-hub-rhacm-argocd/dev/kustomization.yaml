---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: managed-hub-rhacm-argocd
    # source index 0 is rhacm, source index 1 is openshift-gitops
    patch: |
      - op: add
        path: /spec/template/spec/sources/0/helm
        value:
          valuesObject:
            availabilityConfig: Basic
            disableHubSelfManagement: true
      - op: add
        path: /spec/template/spec/sources/1/helm
        value:
          valuesObject:
            server:
              autoscale:
                enabled: false
            rbac:
              defaultPolicy: "role:admin"
            repo:
              replicas: 1
            ha:
              enabled: false
            controller:
              sharding:
                enabled: false
            disableAdmin: false
            appProjects:
              - name: iac-gitops
                sourceRepos:
                  - "https://github.com/bkkhoo/*"
...
