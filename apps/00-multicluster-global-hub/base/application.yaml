---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 00-multicluster-global-hub                # prefix Application name with 00 for sorting purpose
  namespace: openshift-gitops
  labels:
    applications: multicluster-global-hub
spec:
  project: gitops
  source:
    repoURL: https://github.com/bkkhoo/argocd.git
    path: helm-charts/multicluster-global-hub
    targetRevision: main
  destination:
    name: in-cluster
    namespace: multicluster-global-hub
  ignoreDifferences:
    - group: search.open-cluster-management.io    # only interested to annotate the search resource
      kind: Search
      name: search-v2-operator
      namespace: open-cluster-management
      jsonPointers:
        - /metadata/labels
        - /spec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: env
      value: prod
    - name: type
      value: application
    - name: target
      value: in-cluster
...
