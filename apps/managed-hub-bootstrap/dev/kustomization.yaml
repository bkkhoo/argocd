---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: managed-hub-bootstrap
    # /spec/template/spec/sources:
    #   index 0 - rhacm
    #   index 1 - openshift-gitops
    #   index 2 - rhacm
    #   index 3 - managed-hub-app-of-apps
    patch: |
      - op: replace
        path: /spec/generators/0/clusters/selector/matchExpressions/1/value
        value: dev
      - op: add
        path: /spec/template/spec/sources/0/helm
        value:
          valuesObject:
            availabilityConfig: Basic
            disableHubSelfManagement: true
      - op: add
        path: /spec/template/spec/sources/1/helm
        value:
          valuesObject:
            deploymentType: all
            server:
              autoscale:
                enabled: false
            rbac:
              defaultPolicy: "role:admin"
            repo:
              replicas: 1
            ha:
              enabled: false
            controller:
              sharding:
                enabled: false
            disableAdmin: false
            appProjects:
              - name: iac-gitops
                sourceRepos:
                  - "https://github.com/bkkhoo/*"
      - op: replace
        path: /spec/template/spec/sources/3/path
        value: apps/0-managed-hub-app-of-apps/dev
...
