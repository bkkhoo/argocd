---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: rhacs-central
    patch: |
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          valuesObject:
            centralDB:
              resources:
                limits:
                  cpu: "8"
                  memory: 16Gi
                requests:
                  cpu: "4"
                  memory: 8Gi
            central:
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
                requests:
                  cpu: 1500m
                  memory: 4Gi
            minimumAccessRole: Analyst
...
