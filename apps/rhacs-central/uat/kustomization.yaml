# values files are located relative to the chart path specified in the sources.path
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: 01-rhacs-central
    patch: |
    patch: |
      - op: add
        path: /spec/sources/0/helm/valueFiles
        value:
          - ../../apps/rhacs-central/dev/values.yaml
...
