---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-rhacs-central
  namespace: openshift-gitops
  labels:
    applications: rhacs-central
spec:
  project: gitops
  sources:
    - repoURL: https://github.com/bkkhoo/argocd.git
      targetRevision: main
      path: helm-charts/rhacs
      helm:
        parameters:
          - name: deploymentType              # this deploys operator, central, secured-cluster, etc
            value: all
          - name: clusterName
            value: local-cluster
  destination:
    name: in-cluster
    namespace: stackrox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: env
      value: prod
    - name: type
      value: applicationSet
    - name: target
      value: in-cluster
...
