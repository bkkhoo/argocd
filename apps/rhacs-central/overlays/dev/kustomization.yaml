---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# values files are located relative to the chart path specified in the sources.path
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: 01-rhacs-central
    patch: |
      - op: replace
        path: /spec/source/helm/valueFiles/0
        value: ../../apps/rhacs-central/overlays/dev/values.yaml
      - op: replace
        path: /spec/info/0/value
        value: dev
...
