---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhacm-policies
  namespace: openshift-gitops
  labels:
    applications: rhacm-policies
spec:
  project: iac-gitops
  sources:
    - repoURL: https://github.com/bkkhoo/argocd.git
      targetRevision: main
      path: rhacm-policies/base
  destination:
    name: in-cluster
    namespace: stackrox
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
...
