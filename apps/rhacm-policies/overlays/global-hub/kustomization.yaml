---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: 00-rhacm-policies
    patch: |
      - op: replace
        path: /spec/source/path
        value: rhacm-policies/overlays/global-hub
...
