---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-managed-hub-bootstrap
  namespace: openshift-gitops
  labels:
    applications: managed-hub-bootstrap
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true  # prevent child resources from being deleted, when the parent Application is deleted
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: managed-hub
              operator: Exists
            - key: env
              operator: In
              values:
                - dev
  template:
    metadata:
      name: "dev-{{ name }}-managed-hub-bootstrap"
      labels:
        applications: managed-hub-bootstrap
    spec:
      project: iac-gitops
      sources:
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm
          helm:
            valuesObject:
              deploymentType: all
              availabilityConfig: Basic
              disableHubSelfManagement: true
        - repoURL: https://github.com/bkkhoo/helm-values.git
          targetRevision: main
          path: openshift-gitops/dev
          ref: helmValues       # for referencig value files from git source
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/openshift-gitops
          helm:
            valuesObject:
              deploymentType: all
            valueFiles:
              # referencing values from git repo source[1].ref
              # even though ource[1].ref.path is specified, the $helmValues still represents the root of the source with ref field
              - $helmValues/openshift-gitops/dev/values.yaml
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: helm-charts/rhacm-openshift-gitops-integration
        - repoURL: https://github.com/bkkhoo/argocd.git
          targetRevision: main
          path: apps/01-managed-hub-app-of-apps/dev
      destination:
        server: "{{ server }}"
        namespace: default     # objects deployed to multiple namespaces
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
...
