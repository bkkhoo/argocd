# one or more git/helm repos, if the repos are the same for all env (dev/uat/prod), just repeat the list
# the username and password parameters are optional
---
argo_repos:
  dev:
    - name: repo-github-argocd
      type: git
      url: https://github.com/bkkhoo/argocd.git
      username: <username>
      password: <access-token>
    - name: repo-github-helm-values
      type: git
      url: https://github.com/bkkhoo/helm-values.git
      username: <username>
      password: <access-token>
    - name: repo-openshift-helm-charts
      type: helm
      url: https://charts.openshift.io/
  uat:
    - name: repo-github-argocd
      type: git
      url: https://github.com/bkkhoo/argocd.git
      username: <username>
      password: <access-token>
    - name: repo-github-helm-values
      type: git
      url: https://github.com/bkkhoo/helm-values.git
      username: <username>
      password: <access-token>
    - name: repo-openshift-helm-charts
      type: helm
      url: https://charts.openshift.io/
  prod:
    - name: repo-github-argocd
      type: git
      url: https://github.com/bkkhoo/argocd.git
      username: <username>
      password: <access-token>
    - name: repo-github-helm-values
      type: git
      url: https://github.com/bkkhoo/helm-values.git
      username: <username>
      password: <access-token>
    - name: repo-openshift-helm-charts
      type: helm
      url: https://charts.openshift.io/
...
