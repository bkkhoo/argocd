# one or more git/helm repos
# the username and password parameters are optional
---
repos:
  - name: github-argocd
    type: git
    url: https://github.com/bkkhoo/argocd.git
    username: <username>
    password: <access-token>
  - name: github-helm-values
    type: git
    url: https://github.com/bkkhoo/helm-values.git
    username: <username>
    password: <access-token>
  - name: openshift-helm-charts
    type: helm
    url: https://charts.openshift.io/
...
