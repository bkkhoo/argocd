# ansible-playbook -i localhost, bootstrap/ansible/bootstrap.yaml -e config=basic -e global_hub=yes
# or
# ansible-playbook -i localhost, bootstrap/ansible/bootstrap.yaml -e config=ha -e global_hub=yes
#
---
- name: bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    config: basic                 # basic or ha
    global_hub: yes
    env: prod
    ha_environ:
      basic:
        availabilityConfig: Basic
        gitOpsValuesFile: "values-openshift-gitops-basic.yaml"
      ha:
        availabilityConfig: High
        gitOpsValuesFile: "values-openshift-gitops-ha.yaml"
  vars_files:
    - argocd-repo-vault-encrypted.yaml                # this file is encrypted with ansible-vault
    - openshift-logging-token-vault-encrypted.yaml    # this file is encrypted with ansible-vault
    - metallb-bgp-password-vault-encrypted.yaml       # this file is encrypted with ansible-vault

  tasks:
    - name: fail if invalid config
      when: "config not in ['basic', 'ha']"
      ansible.builtin.fail:
        msg: "config can only be: basic or ha"

    - name: "ensure {{ item }} is deployed"
      loop:
        - openshift-gitops
        - rhacm
      vars:
        _ha_environ: "{{ ha_environ[config] }}"
      ansible.builtin.include_tasks: "tasks/deploy-{{ item }}.yaml"

    - name: check gitops console plugins
      register: console_plugins
      ansible.builtin.command:
        cmd: oc get consoles.operator.openshift.io cluster --output jsonpath="{.spec.plugins}"

    - name: ensure gitops console plungin is enabled
      when: "'gitops-plugin' not in console_plugins.stdout"
      ansible.builtin.command:
        cmd: >-
          oc patch consoles.operator.openshift.io cluster --type=json
          --patch='[{"op": "add", "path": "/spec/plugins/-", "value": "gitops-plugin"}]'

    - name: ensure rhacm openshift-gitops integration is configured
      ansible.builtin.shell:
        cmd: "helm template {{ playbook_dir }}/../..//helm-charts/rhacm-openshift-gitops-integration | oc apply --filename -"

    - name: ensure rhacm-policies namespace exist
      ansible.builtin.shell:
        cmd: oc create namespace rhacm-policies --dry-run=client --output yaml | oc apply --filename -

    - name: ensure local-cluster is labeled with the correct env
      ansible.builtin.command:
        cmd: oc label managedclusters.cluster.open-cluster-management.io local-cluster --overwrite env={{ env }}

    - name: ensure global hub secrets exist
      loop:
        - secret_name: argocd-repo-all-envs
          labels:                              # labels for the secret; these will be synced to managed hub
            argocd.argoproj.io/secret-type: repository
          annotations: {}                      # annotations for the secret; these will be synced to managed hub
          data: "{{ argo_repos }}"             # the data comes from the ansible vault encrypted vars_files
          target_name: argocd-repo             # name of the secret to create in the target managed hub
          target_namespace: openshift-gitops   # namespace to create the secret on the target managed hub, in addition to rhacm-policies namespace
        - secret_name: openshift-logging-bearer-tokens-all-envs
          labels: {}
          annotations: {}
          data: "{{ openshift_logging_bearer_tokens }}"
          target_name: openshift-logging-bearer-tokens
          target_namespace: openshift-logging
        - secret_name: metallb-bgp-password-all-envs
          labels: {}
          annotations: {}
          data: "{{ metallb_bpg }}"
          target_name: metallb-bgp-password
          target_namespace: rhacm-policies
      loop_control:
        label: "{{ item.secret_name }}"
      vars:
        _secret_name: "{{ item.secret_name }}"
        _labels: "{{ item.labels }}"
        _annotations: "{{ item.annotations }}"
        _data: "{{ item.data }}"
        _target_name: "{{ item.target_name }}"
        _target_namespace: "{{ item.target_namespace }}"
        _template: global-hub-secret.yaml.j2
      ansible.builtin.include_tasks: tasks/deploy-secret.yaml

    # assuming the repos requires access token for access
    # even though the rhacm policy config-sync-global-hub-secrets will sync the secrets into openshift-gitops namespace
    # have to create the argocd repo secrets here 1st, since the rhacm policy cannot be deployed without the access token in the secrets
    # this issue does not exist for managed hubs, since the rhacm policy config-sync-global-hub-secrets would have sync the argocd
    # repo secrets as soon as the openshift-gitops namespace is created by the managed-hub-bootstrap app
    - name: ensure argocd repo secrets exist
      vars:
        _secret_name: argocd-repos
        _repos: "{{ argo_repos[env] }}"
        _template: argocd-repo-secret.yaml.j2
      ansible.builtin.include_tasks: tasks/deploy-secret.yaml

    - name: ensure global-hub app-of-apps is deployed
      when: global_hub | bool
      ansible.builtin.command: oc apply -k {{ playbook_dir }}/../../apps/00-global-hub-app-of-apps/base

    - name: ensure managed-hub app-of-apps is deployed
      when: not (global_hub | bool)
      ansible.builtin.command: oc apply -k {{ playbook_dir }}/../../apps/00-managed-hub-app-of-apps/overlays/{{ env }}
...
