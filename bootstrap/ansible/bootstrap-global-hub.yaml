---
- name: bootstrap multicluster global hub
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    config: basic
    _context:
      basic:
        availabilityConfig: Basic
        postgresRetention: 3m
        gitOpsValuesFile: "values-openshift-gitops-basic.yaml"
      ha:
        availabilityConfig: High
        postgresRetention: 18m
        gitOpsValuesFile: "values-openshift-gitops-ha.yaml"
    _operators:
      - name: rhacm
        namespace: open-cluster-management
        csv_name: advanced-cluster-management
      - name: openshift-gitops
        namespace: openshift-gitops-operator
        csv_name: openshift-gitops-operator
      - name: multicluster-global-hub
        namespace: multicluster-global-hub
        csv_name: multicluster-global-hub

  tasks:
    - name: fail if invalid config
      ansible.builtin.fail:
        msg: "config can only be: basic or ha"
      when: "config not in ['basic', 'ha']"

    - name: ensure operator is deployed
      loop: "{{ _operators }}"
      register: csv_result
      ansible.builtin.shell:
        cmd: >
          helm template {{ playbook_dir }}/../../helm-charts/{{ item.name }}
          --set deploymentType=operator
          | oc apply -f -

    - name: ensure operator status is Succeeded
      loop: "{{ _operators }}"
      vars:
        _csv_name: "{{ item.csv_name }}"
        _namespace: "{{ item.namespace }}"
      ansible.builtin.include_tasks: tasks/operator-status.yaml

    - name: deploy and configure rhacm
      ansible.builtin.import_tasks: tasks/rhacm.yaml

    - name: deploy and configure openshift gitops
      ansible.builtin.import_tasks: tasks/openshift-gitops.yaml

    - name: ensure rhacm openshift-gitops integration is configured
      ansible.builtin.shell:
        cmd: "helm template {{ playbook_dir }}/../..//helm-charts/rhacm-openshift-gitops-integration | oc apply -f -"

    - name: deploy and configure multicluster global hub
      ansible.builtin.import_tasks: tasks/multicluster-global-hub.yaml
...
