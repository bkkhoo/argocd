---
- name: "ensure {{ _helm_chart }} operator is deployed"
  when:
  register: csv_result
  ansible.builtin.shell:
    cmd: >-
      helm template {{ playbook_dir }}/../../helm-charts/{{ _helm_chart }}
      --set deploymentType=operator
      | oc apply -f -

- name: "ensure {{ _csv_name }} csv status is Succeeded"
  register: csv_result
  until:
    - "_csv_name in csv_result.stdout"
    - "'Succeeded' in csv_result.stdout"
  delay: 5
  retries: 68
  ansible.builtin.command:
    cmd: |-
      oc -n {{ _namespace }} get csv --output jsonpath='{range .items[*]}{.metadata.name} {.status.phase}{"\n"}{end}'

- name: "ensure validation webhook pods for {{ _csv_name }} are in Running state"
  when: _validation_webhook
  register: pod_result
  failed_when: false     # ignore return code
  until:                 # must have more than 0 pod, and number of Running pods must equal to total number of pods
    - pod_result.stdout_lines| length != 0
    - (pod_result.stdout_lines | select("search", "Running") | length) == (pod_result.stdout_lines| length)
  delay: 3
  retries: 13
  ansible.builtin.command:
    cmd: |-
      oc -n {{ _validation_webhook.namespace }} get pod --selector {{ _validation_webhook.pod_selector }} --no-headers

- name: "ensure validation webhook endpoints for {{ _csv_name }} in serving state"
  when: _validation_webhook
  register: eps_result
  failed_when: false     # ignore return code
  until:                 # command must be successful; must have more than one endpoint; all endpoints must be in serving state
    - eps_result.rc == 0
    - '"," in eps_result.stdout'
    - '"false" not in eps_result.stdout'
  delay: 3
  retries: 13
  ansible.builtin.command:
    cmd: |-
      oc -n {{ _validation_webhook.namespace }} get endpointslices.discovery.k8s.io
      --selector {{ _validation_webhook.ep_selector }}
      --no-headers --output custom-columns=":endpoints[*].conditions.serving"

- name: "ensure {{ _instance.kind }} instance is deployed"
  ansible.builtin.shell: >-
    helm template {{ playbook_dir }}/../../helm-charts/{{ _helm_chart }} {{ _instance.helm_options }} | oc apply -f -

- name: "ensure {{ _instance.kind }} instance reach Running/Available phase"
  register: instance_result
  until: "_instance.status in instance_result.stdout"
  delay: 5
  retries: 108
  ansible.builtin.command:
    cmd: >-
      oc {{ "-n " + _instance.namespace if _instance.namespace else "" }} get {{ _instance.kind }} {{ _instance.name }}
      --output jsonpath="{.status.phase}"
...
