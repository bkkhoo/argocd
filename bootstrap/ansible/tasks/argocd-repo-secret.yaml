---
- name: create repo secret yaml manifest from template
  ansible.builtin.template:
    src: argocd-repo-secret.yaml.j2
    dest: /tmp/argocd-repo-secret.yaml
    mode: "0600"

- name: "ensure {{ repo_name }} repo secret is deployed"
  loop:
    - openshift-gitops     # for hub (global or rhacm) argocd
    - rhacm-policies       # for global-hub rhacm to copy to copy to managed-hubs
  loop_control:
    loop_var: _item
  ansible.builtin.command:
    cmd: oc -n {{ _item }} apply -f /tmp/argocd-repo-secret.yaml

- name: ensure temp file is deleted
  ansible.builtin.file:
    path: /tmp/argocd-repo-secret.yaml
    state: absent
...
