---
- name: create secret manifest ({{ item.secret_name }}) from template
  ansible.builtin.template:
    src: global-hub-secret.yaml.j2
    dest: "/tmp/{{ item.secret_name }}.yaml"
    mode: "0600"

- name: ensure secret manifest is deployed
  ansible.builtin.command:
    cmd: oc apply -f "/tmp/{{ item.secret_name }}.yaml"

- name: ensure temp file is deleted
  ansible.builtin.file:
    path: "/tmp/{{ item.secret_name }}.yaml"
    state: absent
...
