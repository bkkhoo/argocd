---
- name: create secret manifest from template {{ _template }}.j2
  ansible.builtin.template:
    src: "{{ _template }}.j2"
    dest: "/tmp/{{ _template }}"
    mode: "0600"

- name: ensure secret manifest {{ _template }} is deployed
  ansible.builtin.command:
    cmd: oc apply -f /tmp/{{ _template }}

- name: ensure temp file /tmp/{{ _template }} is deleted
  ansible.builtin.file:
    path: "/tmp/{{ _template }}"
    state: absent
...
