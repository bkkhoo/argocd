---
- name: create secret manifest from template
  ansible.builtin.template:
    src: "{{ _template }}.j2"
    dest: "/tmp/{{ _template }}"
    mode: "0600"

- name: ensure openshift logging tokens secret is deployed
  ansible.builtin.command:
    cmd: oc apply -f /tmp/{{ _template }}

- name: ensure temp file is deleted
  ansible.builtin.file:
    path: "/tmp/{{ _template }}"
    state: absent
...
