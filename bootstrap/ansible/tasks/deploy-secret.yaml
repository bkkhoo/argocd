---
- name: create secret manifest ({{ _secret_name }}) from template
  ansible.builtin.template:
    src: "{{ _template }}"
    dest: "/tmp/{{ _secret_name }}.yaml"
    mode: "0600"

- name: ensure secret manifest is deployed
  ansible.builtin.command:
    cmd: oc apply -f "/tmp/{{ _secret_name }}.yaml"

- name: ensure temp file is deleted
  ansible.builtin.file:
    path: "/tmp/{{ _secret_name }}.yaml"
    state: absent
...
