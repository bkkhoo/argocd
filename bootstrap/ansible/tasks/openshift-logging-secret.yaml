---
- name: create openshift logging tokens yaml manifest from template
  ansible.builtin.template:
    src: openshift-logging-token.yaml.j2
    dest: /tmp/openshift-logging-token.yaml
    mode: "0600"

- name: ensure openshift logging tokens secret is deployed
  ansible.builtin.command:
    cmd: oc -n rhacm-policies apply -f /tmp/openshift-logging-token.yaml

- name: ensure temp file is deleted
  ansible.builtin.file:
    path: /tmp/openshift-logging-token.yaml
    state: absent
...
