---
- name: ensure multiClusterHub instance is created
  ansible.builtin.shell:
    cmd: >
      helm template {{ playbook_dir }}/../../helm-charts/multicluster-global-hub
      --set deploymentType=global-hub
      --set availabilityConfig="{{ _context[config]['availabilityConfig'] }}"
      --set postgresRetention="{{ _context[config]['postgresRetention'] }}"
      | oc apply -f -

- name: wait for MulticlusterGlobalHub instance to reach Running phase
  register: mcgh_result
  until: "'Running' in mcgh_result.stdout"
  delay: 5
  retries: 30
  ansible.builtin.command:
    cmd: oc -n multicluster-global-hub get multiclusterglobalhubs multiclusterglobalhub -o jsonpath="{.status.phase}"
...
