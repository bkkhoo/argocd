---
- name: ensure MultiClusterHub instance is created
  ansible.builtin.shell:
    cmd: >
      helm template {{ playbook_dir }}/../../helm-charts/rhacm
      --set deploymentType=multicluster-hub
      --set availabilityConfig="{{ _context[config]['availabilityConfig'] }}"
      --set disableHubSelfManagement=false
      | oc apply -f -

- name: wait for MultiClusterHub instance to reach Running phase
  register: mch_result
  until: "'Running' in mch_result.stdout"
  delay: 5
  retries: 88
  ansible.builtin.command:
    cmd: oc -n open-cluster-management get multiclusterhubs.operator.open-cluster-management.io multiclusterhub -o jsonpath="{.status.phase}"

- name: wait for MultiClusterEngine instance to reach Available phase
  register: mce_result
  until: "'Available' in mce_result.stdout"
  delay: 5
  retries: 30
  ansible.builtin.command:
    cmd: oc get multiclusterengines.multicluster.openshift.io multiclusterengine -o jsonpath="{.status.phase}"
...
